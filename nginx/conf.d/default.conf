server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # In a real production setup, we would redirect 80 to 443
    # return 301 https://$host$request_uri;

    # Include security headers
    include /etc/nginx/snippets/security-headers.conf;

    # Root for static files
    root /var/www/frontend/dist;
    index index.html index.htm;

    # API and Sanctum requests to Laravel Backend
    location ~ ^/(api|sanctum) {
        limit_req zone=api_limit burst=20 nodelay;
        
        fastcgi_pass backend_api;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        
        # Adjust timeouts for ML Engine processing
        fastcgi_read_timeout 60s;
    }

    # Development specific routing (proxy to vite dev server)
    # In production, this would just serve static files from root
    location / {
        proxy_pass http://frontend_dev;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Vite HMR
    location /@vite {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    error_page 404 /index.html;
}
